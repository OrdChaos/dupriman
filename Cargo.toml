[package]
name = "dupriman"
version = "0.1.0"
edition = "2024"
description = "Manual duplex printing assistant for single-sided printers (CUPS backend + prompt daemon)"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# GTK4 原生弹窗（弹窗守护进程使用；需系统安装 gtk4 >= 4.10）
gtk4 = { version = "0.10", features = ["v4_10"] }
libc = "0.2"

[profile.release]
strip = true
lto = true
